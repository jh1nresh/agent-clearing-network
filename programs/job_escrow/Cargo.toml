[package]
name = "job_escrow"
version = "0.1.0"
description = "Escrow state machine for agent jobs — USDC vault + evaluator-gated settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "job_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "reputation_ledger/idl-build"]


[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
reputation_ledger = { path = "../reputation_ledger", features = ["cpi"] }

